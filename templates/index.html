<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfyUI Metadata Reader</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a18; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 500; margin-bottom: 0.25rem; }
  .subtitle { font-size: 0.875rem; color: #6b6b67; margin-bottom: 2rem; }
  #drop-zone { border: 1.5px dashed #b0afa8; border-radius: 12px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: background 0.15s, border-color 0.15s; background: #fff; }
  #drop-zone:hover, #drop-zone.over { background: #f0efe9; border-color: #888; }
  #drop-zone svg { margin-bottom: 0.75rem; color: #888; }
  #drop-zone p { color: #444; font-size: 0.95rem; }
  #drop-zone .hint { font-size: 0.8rem; color: #888; margin-top: 0.25rem; }
  #file-input { display: none; }
  .card { background: #fff; border: 0.5px solid #d0cfc8; border-radius: 12px; padding: 1.25rem; margin-top: 1.5rem; }
  .file-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
  .file-header img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 0.5px solid #d0cfc8; }
  .file-name { font-size: 0.95rem; font-weight: 500; }
  .file-meta { font-size: 0.8rem; color: #888; margin-top: 2px; }
  .badge { margin-left: auto; font-size: 0.7rem; padding: 3px 10px; border-radius: 6px; background: #e6f1fb; color: #185fa5; }
  .tabs { display: flex; border-bottom: 0.5px solid #d0cfc8; margin-bottom: 1rem; }
  .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 16px; font-size: 0.85rem; color: #888; cursor: pointer; transition: all 0.15s; }
  .tab-btn:hover { color: #333; }
  .tab-btn.active { color: #1a1a18; border-bottom-color: #1a1a18; font-weight: 500; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  .kv-row { display: flex; gap: 12px; padding: 7px 0; border-bottom: 0.5px solid #ebebea; font-size: 0.85rem; }
  .kv-row:last-child { border-bottom: none; }
  .kv-key { color: #888; min-width: 140px; flex-shrink: 0; }
  .kv-val { color: #1a1a18; word-break: break-all; }
  .node-card { background: #f5f4f0; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .node-title { font-size: 0.8rem; font-weight: 500; margin-bottom: 2px; }
  .node-type { font-size: 0.75rem; color: #888; margin-bottom: 6px; }
  pre { font-family: 'Consolas', 'Menlo', monospace; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all; padding: 1rem; background: #f5f4f0; border-radius: 8px; max-height: 500px; overflow-y: auto; }
  .copy-row { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .copy-btn { font-size: 0.75rem; padding: 4px 12px; border: 0.5px solid #b0afa8; border-radius: 6px; background: none; cursor: pointer; color: #444; }
  .copy-btn:hover { background: #f0efe9; }
  .warn { background: #faeeda; border-radius: 8px; padding: 0.875rem 1.25rem; font-size: 0.875rem; color: #633806; margin-top: 1.5rem; display: none; }
  .spinner { display: none; text-align: center; padding: 2rem; color: #888; font-size: 0.875rem; }
  #result { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>ComfyUI Metadata Reader</h1>
  <p class="subtitle">Drop a PNG generated by ComfyUI to inspect its embedded workflow and generation parameters.</p>
  <div id="drop-zone" onclick="document.getElementById('file-input').click()">
    <input type="file" id="file-input" accept="image/png">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>Drop a ComfyUI PNG here</p>
    <p class="hint">or click to browse — only PNG files are supported</p>
  </div>
  <div class="spinner" id="spinner">Parsing metadata...</div>
  <div class="warn" id="warn"></div>
  <div id="result" class="card">
    <div class="file-header">
      <img id="thumb" src="" alt="preview">
      <div><div class="file-name" id="fname"></div><div class="file-meta" id="fmeta"></div></div>
      <span class="badge" id="badge"></span>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('summary')">Summary</button>
      <button class="tab-btn" onclick="showTab('nodes')">Nodes</button>
      <button class="tab-btn" onclick="showTab('prompt')">Prompt JSON</button>
      <button class="tab-btn" onclick="showTab('workflow')">Workflow JSON</button>
    </div>
    <div id="tab-summary" class="tab-pane active"></div>
    <div id="tab-nodes" class="tab-pane"></div>
    <div id="tab-prompt" class="tab-pane">
      <div class="copy-row"><button class="copy-btn" onclick="copyText('pre-prompt')">Copy</button></div>
      <pre id="pre-prompt"></pre>
    </div>
    <div id="tab-workflow" class="tab-pane">
      <div class="copy-row"><button class="copy-btn" onclick="copyText('pre-workflow')">Copy</button></div>
      <pre id="pre-workflow"></pre>
    </div>
  </div>
</div>
<script>
function showTab(name) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach((b,i) => { const n=['summary','nodes','prompt','workflow']; b.classList.toggle('active', n[i]===name); });
  document.getElementById('tab-'+name).classList.add('active');
}
function copyText(id) { navigator.clipboard.writeText(document.getElementById(id).textContent); }
function kv(key, val) { return '<div class="kv-row"><span class="kv-key">'+key+'</span><span class="kv-val">'+esc(val)+'</span></div>'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
async function handleFile(file) {
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.png')) { showWarn('Please select a PNG file.'); return; }
  document.getElementById('result').style.display='none';
  document.getElementById('warn').style.display='none';
  document.getElementById('spinner').style.display='block';
  document.getElementById('thumb').src = URL.createObjectURL(file);
  document.getElementById('fname').textContent = file.name;
  document.getElementById('fmeta').textContent = (file.size/1024).toFixed(1)+' KB';
  const fd = new FormData(); fd.append('file', file);
  try {
    const res = await fetch('/api/parse', {method:'POST', body:fd});
    const data = await res.json();
    document.getElementById('spinner').style.display='none';
    if (data.error && !data.summary) { showWarn(data.error); return; }
    document.getElementById('badge').textContent = data.has_workflow ? 'Full workflow' : 'Prompt only';
    document.getElementById('result').style.display='block';
    if (data.summary && data.summary.length) {
      document.getElementById('tab-summary').innerHTML = data.summary.map(r=>kv(r.key,r.value)).join('');
    } else {
      document.getElementById('tab-summary').innerHTML = '<p style="color:#888;font-size:.875rem;padding:.5rem 0">No summary found — check the Nodes or JSON tabs.</p>';
    }
    if (data.nodes && data.nodes.length) {
      document.getElementById('tab-nodes').innerHTML = data.nodes.map(n=>'<div class="node-card"><div class="node-title">Node '+esc(n.id)+'</div><div class="node-type">'+esc(n.class_type)+'</div>'+Object.entries(n.inputs).map(([k,v])=>kv(k,v)).join('')+'</div>').join('');
    }
    document.getElementById('pre-prompt').textContent = data.prompt_json || 'Not found';
    document.getElementById('pre-workflow').textContent = data.workflow_json || 'Not found';
    showTab('summary');
  } catch(e) { document.getElementById('spinner').style.display='none'; showWarn('An error occurred while parsing.'); }
}
function showWarn(msg) { const w=document.getElementById('warn'); w.textContent=msg; w.style.display='block'; }
const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('over');});
dz.addEventListener('dragleave', ()=>dz.classList.remove('over'));
dz.addEventListener('drop', e=>{e.preventDefault();dz.classList.remove('over');handleFile(e.dataTransfer.files[0]);});
document.getElementById('file-input').addEventListener('change', e=>handleFile(e.target.files[0]));
</script>
</body>
</html>
